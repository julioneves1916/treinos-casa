<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Julio Treinos" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Julio Neves - Treinos</title>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="titles">
        <h1>Julio Neves</h1>
        <p class="subtitle" id="sub-label">Treinos · Hipertrofia</p>
      </div>
      <span id="sync-dot" class="sync-dot" title="Sincronização"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="agenda" role="tab">Agenda</button>
      <button class="tab" data-view="progresso" role="tab">Progresso</button>
      <button class="tab" data-view="corpo" role="tab">Corpo</button>
      <button class="tab" data-view="ajustes" role="tab">Ajustes</button>
    </nav>
  </header>

  <main id="app">
    <section id="view-agenda" class="view active"></section>
    <section id="view-sessao" class="view"></section>
    <section id="view-progresso" class="view"></section>
    <section id="view-corpo" class="view"></section>
    <section id="view-ajustes" class="view"></section>
  </main>

  <div id="rest-bar" class="rest-bar" hidden>
    <div class="rest-info">
      <span class="rest-label" id="rest-label">Descanso</span>
      <span class="rest-clock" id="rest-clock">00:00</span>
      <span class="rest-next" id="rest-next"></span>
    </div>
    <div class="rest-actions">
      <button id="rest-plus" class="pill">+15s</button>
      <button id="rest-skip" class="pill">Pular</button>
    </div>
  </div>

  <script src="lib.js"></script>
  <script src="polar.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
