<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Treinos da Casa</title>
  <style>
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      background:#0b0b0c;color:#f5f5f7;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    .wrap{display:grid;gap:18px;padding:24px;width:100%;max-width:420px}
    a{display:block;text-decoration:none;border-radius:18px;padding:22px 24px;
      border:1.5px solid #26262b;transition:transform .1s ease}
    a:active{transform:scale(.98)}
    h1{font-size:20px;margin:0 0 2px}
    p{margin:0;font-size:14px;opacity:.75}
    .jn{background:#141416;color:#f5f5f7}
    .jn h1{color:#e7c27a}
    .fp{background:#fff3ec;color:#43302e}
    .fp h1{color:#e26d8f}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="jn" href="app/">
      <h1>Julio Neves · Treinos</h1>
      <p>300 treinos BlackSheep — método completo</p>
    </a>
    <a class="fp" href="fitpimpa/">
      <h1>FitPimpa 🐾</h1>
      <p>300 treinos com a Coach Margareth</p>
    </a>
  </div>
</body>
</html>
